name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

  migration-check:
    name: Fixture makemigrations check
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: makemigrations --check
        run: uv run django-admin makemigrations the_music_tree_api_kit --check --dry-run

  # Job-level routing (#52, github-config#85): `Pytest` may be a required check, so no workflow-level paths filter.
  # A skipped job counts as passing; `!cancelled()` makes a failed `route` run the suite instead of skipping it.
  route:
    name: Pytest route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.route.outputs.applicable }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: route
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then echo applicable=true >>"$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames lists both names of a rename; HEAD^1 is the base tip the PR was merged onto.
          # A file, not $(...): command substitution drops the NUL separators.
          diff_file="$RUNNER_TEMP/changed-files"
          if git diff --no-renames -z --name-only HEAD^1 HEAD >"$diff_file" && [[ -s $diff_file ]]; then
            python3 scripts/pytest_route.py <"$diff_file" >>"$GITHUB_OUTPUT" || echo applicable=true >>"$GITHUB_OUTPUT"
          else
            echo applicable=true >>"$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: echo "Pytest applicable is ${{ steps.route.outputs.applicable }}" >>"$GITHUB_STEP_SUMMARY"

  pytest:
    name: Pytest
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.applicable != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest --cov-branch --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pytest
          path: coverage.xml
          if-no-files-found: error

  coverage:
    needs: [pytest]
    permissions:
      contents: read
    uses: BehindTheMusicTree/github-workflows/.github/workflows/coverage.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0

  tests-success:
    name: Tests success
    if: always()
    needs: [route, pytest, coverage]
    runs-on: ubuntu-latest
    steps:
      # Scoped gate recognized by github-config `check-required-gates.sh`: `route` must succeed, then `pytest` and
      # `coverage` all succeed when it reports applicable=true and are all skipped when it reports false.
      - name: All test jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e --arg scope route '.[$scope] as $s | del(.[$scope]) as $rest | $s.result == "success" and ($rest | length) > 0 and (if $s.outputs.applicable == "true" then all($rest[]; .result == "success") elif $s.outputs.applicable == "false" then all($rest[]; .result == "skipped") else false end)' <<<"$NEEDS"
